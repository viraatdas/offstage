name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is where the vm lane and most users live; Linux is where the
        # container lane actually runs, and has a code path (--user $(id -u))
        # that exists only there. Node 20 is the floor `engines` promises.
        os: [macos-latest, ubuntu-latest]
        node: ['20', '22', 'lts/*']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The clean-clone gate, exactly as docs/verified.md describes it. The
      # suite is written to pass with no container runtime and no Tart: lanes
      # whose substrate is missing report themselves unavailable rather than
      # failing, which is the behaviour under test.
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # The bins are declared in package.json; prove they resolve to files that
      # exist and actually execute, on every OS and Node version in the matrix.
      - name: the published entry points run
        run: |
          node dist/cli/index.js --help
          node dist/cli/index.js route --json -- npx playwright test
          node dist/cli/index.js route --json -- npx playwright test --headed

  # A shipped file that changes without a version bump is undeliverable: Claude
  # Code's `plugin update` compares the declared version, not the commit, so
  # everyone already installed keeps the old copy forever. This catches that
  # class of change at the only point where it is still cheap to fix.
  deliverable:
    name: shipped changes carry a version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs against the last version tag, which a shallow
          # default checkout does not fetch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: node scripts/release-guard.mjs

  package:
    name: packs cleanly from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      # `prepack` builds, so this must produce a tarball containing dist/ even
      # though dist/ is gitignored and absent from the checkout.
      - name: the tarball contains the entry points it publishes
        run: |
          # Ask npm for the filename rather than globbing it: a scoped package
          # packs to viraatdas-offstage-<v>.tgz, and an `offstage-*.tgz` glob
          # silently stops matching the moment the name changes.
          TARBALL="$(npm pack --silent)"
          echo "packed $TARBALL"
          tar tzf "$TARBALL" > files.txt
          grep -q 'package/dist/cli/index.js' files.txt || { echo "MISSING dist/cli/index.js"; exit 1; }
          grep -q 'package/dist/mcp/index.js' files.txt || { echo "MISSING dist/mcp/index.js"; exit 1; }
          grep -q 'package/skills/offstage/SKILL.md' files.txt || { echo "MISSING the skill"; exit 1; }
          grep -q 'package/LICENSE' files.txt || { echo "MISSING LICENSE"; exit 1; }
          ! grep -q 'package/tests/' files.txt || { echo "tests/ must not ship"; exit 1; }
          ! grep -q 'package/scripts/' files.txt || { echo "scripts/ are development aids and must not ship"; exit 1; }
