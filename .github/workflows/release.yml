name: Release

# Publishing is a tag push, and nothing else. No token is stored anywhere:
# npm's trusted publishing exchanges GitHub's OIDC identity for a short-lived
# credential, which is why `id-token: write` is required and why there is no
# NODE_AUTH_TOKEN in this file.
#
# One-time setup on npmjs.com (needs the package to already exist — npm cannot
# configure a trusted publisher for a name that has never been published):
#   Package settings -> Trusted Publisher -> GitHub Actions
#     repository: viraatdas/offstage
#     workflow:   release.yml
# After that, publishing is: git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for OIDC; without it npm falls back to a token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # OIDC support landed in npm 11; the runner's bundled npm may be older.
      - run: npm install -g npm@latest

      - run: npm ci

      # The tag is the source of truth for what is being released. A tag that
      # disagrees with package.json means someone tagged the wrong commit, and
      # that should stop the release rather than publish a surprising version.
      - name: the tag matches the version being published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }

      - run: npm run typecheck
      - run: npm test

      # No NODE_AUTH_TOKEN: OIDC provides the credential, and npm attaches a
      # provenance attestation automatically when publishing this way.
      - run: npm publish --access public
